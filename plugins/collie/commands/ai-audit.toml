description = "Static audit of an LLM app or agent: prompts, tools, RAG, MCP and output handling"
prompt = "Run a static AI-security audit of the repository, or the folder the user names, following the ai-audit skill. Map model calls, prompts, agent tools, retrievers and MCP config, run installed scanners read-only, then trace untrusted input into prompts and model output to its sinks across the checklist: prompt injection, excessive agency, unsafe output handling, data exposure, MCP config, cost and loops. Output findings grouped Critical/High/Medium/Low, most severe first, each with file:line, a concrete exploit case, the smallest fix, and the cost of ignoring it. Never print any secret value, including weak or default ones; give file:line and secret type only. End with what you did not check and the one thing to fix first. Never send payloads to a live model. Change no code unless asked."
