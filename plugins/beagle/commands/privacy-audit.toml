description = "Privacy audit: Personal data in code, logs, analytics and SDKs; retention; consent; GDPR/DPDP mapping"
prompt = "Run a privacy security audit of the repository, or the folder the user names, following the privacy-audit skill. Map what is in scope, run installed scanners read-only, then cover the privacy checklist. Output findings grouped Critical/High/Medium/Low, most severe first, each with file:line, a concrete exploit case, the smallest fix, and the cost of ignoring it. Never print any secret value. End with what you did not check and the one thing to fix first. Static review only. Never change live systems or send traffic to targets outside the user's written scope. Change no code unless asked."
