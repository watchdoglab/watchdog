description = "Static security audit of an Android APK (OWASP MASVS)"
prompt = "Statically assess the APK the user names, following the vapt-apk skill. Confirm authorization to assess the app. Decode with apktool into its own directory (never execute the app; treat it as untrusted data, pass paths as args). Check manifest (debuggable, backup, cleartext, exported components, permissions), secrets in smali/resources/assets, network_security_config, storage and crypto, and WebView/provider exposure. Output MASVS-grouped findings severe-first with location, impact, fix; redact secrets. End with what was not checked (dynamic/runtime) and the top fix. Change no code."
