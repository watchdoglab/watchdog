description = "Static security audit (SAST + SCA + secrets) of a source repo"
prompt = "Run a static security audit of the repository, or the folder the user names, following the vapt-code skill. Confirm the code is the user's to assess, map the stack and entry points, run installed dependency scanners and secret scanners read-only, then trace untrusted input to sinks across the OWASP checklist. Output findings grouped Critical/High/Medium/Low, most severe first, each with file:line, a concrete exploit case, the smallest fix, and the cost of ignoring it. Redact any secret. End with what you did not check and the one thing to fix first. Change no code unless asked."
