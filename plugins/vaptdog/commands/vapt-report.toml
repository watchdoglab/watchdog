description = "Merge this session's findings into one ranked VAPT report"
prompt = "Write a client-ready VAPT report from every finding produced in this session, following the vapt-report skill. Write it to the plugin reportDir as Markdown. Include an executive summary in plain English, scope and method with dates and out-of-scope notes, findings grouped Critical/High/Medium/Low most severe first (each with CWE/OWASP ref, affected asset, impact, redacted evidence, remediation), and an appendix of tools used. Keep all secrets redacted. State that this is an authorized assessment."
