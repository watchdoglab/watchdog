description = "Static security audit of an iOS IPA (OWASP MASVS)"
prompt = "Statically assess the IPA the user names, following the vapt-ipa skill. Confirm authorization to assess the app. Unzip into its own directory (never execute it; untrusted data, paths as args). Check Info.plist (ATS, URL schemes, file sharing), entitlements, secrets in the binary and bundle, binary protections (PIE/canary/ARC/encryption), storage and crypto. Output MASVS-grouped findings severe-first with location, impact, fix; redact secrets. End with what was not checked (dynamic/jailbreak runtime) and the top fix. Change no code."
