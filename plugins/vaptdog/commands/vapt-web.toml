description = "Security assessment of a running web app (scope-gated, authorized only)"
prompt = "Assess the web target the user names, following the vapt-web skill. HARD GATE: before sending any request to the target, confirm its host is in the user's written authorized scope; if out of scope or unclear, stop and ask for authorization. Once in scope, do passive checks first (TLS, headers, cookies, CORS, error leakage), then auth/session, then an OWASP Top 10 / ASVS walk, wrapping installed non-destructive tools (nuclei, nikto, ZAP baseline). No DoS, no mass requests, no data destruction; rate-limit yourself. Output findings severe-first with redacted evidence, impact, fix, CWE/OWASP ref. End with scope tested, what was not checked, and the top fix."
