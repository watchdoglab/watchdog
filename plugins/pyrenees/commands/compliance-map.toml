description = "Compliance audit: Map the pack's findings to SOC 2, ISO 27001, PCI DSS, OWASP ASVS"
prompt = "Run a compliance security audit of the repository, or the folder the user names, following the compliance-map skill. Map what is in scope, run installed scanners read-only, then cover the compliance checklist. Output findings grouped Critical/High/Medium/Low, most severe first, each with file:line, a concrete exploit case, the smallest fix, and the cost of ignoring it. Never print any secret value. End with what you did not check and the one thing to fix first. Static review only. Never change live systems or send traffic to targets outside the user's written scope. Change no code unless asked."
