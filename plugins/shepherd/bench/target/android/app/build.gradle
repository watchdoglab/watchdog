android {
    compileSdkVersion 34

    defaultConfig {
        applicationId "com.acme.pay"
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 42
        versionName "2.4.0"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.debug
        }
    }
}
