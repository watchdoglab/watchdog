description = "Mobile deep dive audit: Android/iOS/Flutter/React Native: pinning, storage, deep links, WebViews, bridges"
prompt = "Run a mobile security audit of the repository, or the folder the user names, following the mobile-audit skill. Map what is in scope, run installed scanners read-only, then cover the mobile checklist. Output findings grouped Critical/High/Medium/Low, most severe first, each with file:line, a concrete exploit case, the smallest fix, and the cost of ignoring it. Never print any secret value. End with what you did not check and the one thing to fix first. Static review by default. Dynamic tooling only on builds the user owns and has put in written scope. Change no code unless asked."
