description = "Static audit of Terraform, Kubernetes, Dockerfiles and CI pipelines"
prompt = "Run a static infrastructure audit of the repository, or the folder the user names, following the cloud-audit skill. Map IaC and pipeline files and what is internet-facing, run installed scanners read-only, then follow variables and defaults to real values across the cloud checklist: public exposure, IAM, secrets, workload hardening, encryption and logging, CI supply chain. Output findings grouped Critical/High/Medium/Low, most severe first, each with file:line, a concrete exploit case, the smallest fix, and the cost of ignoring it. Never print any secret value, including weak or default passwords; give file:line and secret type only. End with what you did not check and the one thing to fix first. Never apply, deploy or change cloud state. Change no code unless asked."
