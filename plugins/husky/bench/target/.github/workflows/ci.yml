name: ci
on:
  pull_request_target:
    types: [opened, synchronize]
permissions: write-all
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: some-org/setup-tools@main
      - run: npm ci && npm test
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
