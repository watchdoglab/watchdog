apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
spec:
  replicas: 2
  selector:
    matchLabels: { app: notes-api }
  template:
    metadata:
      labels: { app: notes-api }
    spec:
      serviceAccountName: notes-api
      hostNetwork: true
      containers:
        - name: api
          image: notes/api:latest
          securityContext:
            privileged: true
          env:
            - name: JWT_SECRET
              value: "fake-benchmark-jwt-secret"
          volumeMounts:
            - name: docker-sock
              mountPath: /var/run/docker.sock
      volumes:
        - name: docker-sock
          hostPath:
            path: /var/run/docker.sock
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: notes-api-admin
subjects:
  - kind: ServiceAccount
    name: notes-api
    namespace: default
roleRef:
  kind: ClusterRole
  name: cluster-admin
  apiGroup: rbac.authorization.k8s.io
