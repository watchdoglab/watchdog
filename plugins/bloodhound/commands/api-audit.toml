description = "Static audit of a REST or GraphQL API: spec and handlers together"
prompt = "Run a static API-security audit of the repository, or the folder the user names, following the api-audit skill. Inventory every operation in the spec and every route in code and diff them, run installed scanners read-only, then check each operation for object-level and function-level authorization, authentication, mass assignment and over-shared fields, rate/size/page/depth limits, business-flow bounds, SSRF and misconfiguration. Output findings grouped Critical/High/Medium/Low, most severe first, each with file:line, a concrete request that exploits it, the smallest fix, and the cost of ignoring it. Never print any secret value; give file:line and secret type only. End with what you did not check and the one thing to fix first. Never send requests to a live API. Change no code unless asked."
